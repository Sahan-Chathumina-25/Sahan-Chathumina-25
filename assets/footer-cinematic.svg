<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <defs>
    <style>
      .fc-tagline { font-family:'Segoe UI','Inter',system-ui,sans-serif; font-size:12px; font-weight:600; letter-spacing:3px; fill:#EAF7FF; }
      .fc-sub { font-family:'Segoe UI','Inter',system-ui,sans-serif; font-size:9px; fill:#7F95A5; letter-spacing:1px; }
      .fc-name { font-family:'Segoe UI','Inter',system-ui,sans-serif; font-size:10px; fill:#7F95A5; }
    </style>
    <linearGradient id="fc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070A"/>
      <stop offset="50%" stop-color="#0B1117"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="fc-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1479FF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="fc-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fc-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="fc-blur">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="120" rx="8" fill="url(#fc-bg)"/>
  <rect width="600" height="120" rx="8" fill="url(#fc-glow)"/>

  <g opacity="0.025" stroke="#00D9FF" stroke-width="0.5">
    <line x1="0" y1="0" x2="600" y2="0"/>
    <line x1="0" y1="20" x2="600" y2="20"/>
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="0" x2="0" y2="120"/>
    <line x1="60" y1="0" x2="60" y2="120"/>
    <line x1="120" y1="0" x2="120" y2="120"/>
    <line x1="180" y1="0" x2="180" y2="120"/>
    <line x1="240" y1="0" x2="240" y2="120"/>
    <line x1="300" y1="0" x2="300" y2="120"/>
    <line x1="360" y1="0" x2="360" y2="120"/>
    <line x1="420" y1="0" x2="420" y2="120"/>
    <line x1="480" y1="0" x2="480" y2="120"/>
    <line x1="540" y1="0" x2="540" y2="120"/>
    <line x1="600" y1="0" x2="600" y2="120"/>
  </g>

  <g filter="url(#fc-blur)">
    <g stroke="#00D9FF" stroke-width="0.6" opacity="0.1">
      <line x1="40" y1="26" x2="150" y2="20"/>
      <line x1="150" y1="20" x2="270" y2="28"/>
      <line x1="270" y1="28" x2="390" y2="20"/>
      <line x1="390" y1="20" x2="510" y2="28"/>
      <line x1="510" y1="28" x2="570" y2="24"/>
      <line x1="60" y1="98" x2="180" y2="92"/>
      <line x1="180" y1="92" x2="300" y2="98"/>
      <line x1="300" y1="98" x2="420" y2="92"/>
      <line x1="420" y1="92" x2="540" y2="98"/>
      <line x1="150" y1="20" x2="180" y2="92"/>
      <line x1="390" y1="20" x2="420" y2="92"/>
    </g>

    <circle r="1.8" fill="#00D9FF" opacity="0.55">
      <animateMotion dur="7s" repeatCount="indefinite" path="M40,26 L150,20 L270,28 L390,20 L510,28 L570,24"/>
    </circle>
    <circle r="1.5" fill="#1479FF" opacity="0.45">
      <animateMotion dur="8s" repeatCount="indefinite" path="M540,98 L420,92 L300,98 L180,92 L60,98"/>
    </circle>
    <circle r="1.4" fill="#00D9FF" opacity="0.4">
      <animateMotion dur="9s" repeatCount="indefinite" path="M60,98 L180,92 L300,98 L420,92 L540,98"/>
    </circle>

    <circle cx="40" cy="26" r="2" fill="#00D9FF" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.75;0.5" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="20" r="1.8" fill="#1479FF" opacity="0.45"/>
    <circle cx="270" cy="28" r="2.2" fill="#00D9FF" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.8;0.55" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="20" r="1.8" fill="#1479FF" opacity="0.45"/>
    <circle cx="510" cy="28" r="2" fill="#00D9FF" opacity="0.5"/>
    <circle cx="570" cy="24" r="1.5" fill="#1479FF" opacity="0.4"/>
    <circle cx="60" cy="98" r="1.6" fill="#00D9FF" opacity="0.4"/>
    <circle cx="180" cy="92" r="1.6" fill="#1479FF" opacity="0.4"/>
    <circle cx="300" cy="98" r="1.8" fill="#00D9FF" opacity="0.45"/>
    <circle cx="420" cy="92" r="1.6" fill="#1479FF" opacity="0.4"/>
    <circle cx="540" cy="98" r="1.6" fill="#00D9FF" opacity="0.4"/>
  </g>

  <rect x="0" y="0" width="600" height="1" fill="url(#fc-accent)" opacity="0.16">
    <animate attributeName="y" values="0;120" dur="9s" repeatCount="indefinite"/>
  </rect>

  <line x1="40" y1="14" x2="560" y2="14" stroke="#1C303D" stroke-width="0.5"/>
  <line x1="-100" y1="14" x2="100" y2="14" stroke="url(#fc-beam)" stroke-width="2">
    <animate attributeName="x1" from="-100" to="700" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="100" to="900" dur="5s" repeatCount="indefinite"/>
  </line>

  <text x="300" y="48" text-anchor="middle" class="fc-tagline">BUILD · LEARN · SECURE</text>
  <text x="300" y="66" text-anchor="middle" class="fc-sub">Cybersecurity  |  Networking  |  Linux  |  Full Stack  |  WordPress</text>
  <text x="300" y="86" text-anchor="middle" class="fc-name">Sahan Chathumina</text>

  <line x1="40" y1="104" x2="560" y2="104" stroke="#1C303D" stroke-width="0.5"/>
  <circle cx="300" cy="104" r="2.5" fill="#00D9FF" opacity="0.65">
    <animate attributeName="opacity" values="0.45;0.85;0.45" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
