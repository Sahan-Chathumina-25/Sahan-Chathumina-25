<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120"><defs><style>
    @keyframes beamMove { 0%{x1:-100;x2:100} 100%{x1:700;x2:900} }
    .footer-tagline { font-family:'Segoe UI',system-ui,sans-serif; font-size:12px; font-weight:600; letter-spacing:3px; fill:#EAF7FF; }
    .footer-sub { font-family:'Segoe UI',system-ui,sans-serif; font-size:9px; fill:#7F95A5; letter-spacing:1px; }
    .footer-name { font-family:'Segoe UI',system-ui,sans-serif; font-size:10px; fill:#7F95A5; }
  </style><linearGradient id="beam-g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
    <stop offset="40%" stop-color="#00D9FF" stop-opacity="0.08"/>
    <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.15"/>
    <stop offset="60%" stop-color="#00D9FF" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
  </linearGradient></defs><rect width="600" height="120" fill="#05070A" rx="8"/><line x1="40" y1="16" x2="560" y2="16" stroke="#1A2736" stroke-width="0.5"/><line x1="-100" y1="16" x2="100" y2="16" stroke="url(#beam-g)" stroke-width="2">
    <animate attributeName="x1" from="-100" to="700" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" from="100" to="900" dur="4s" repeatCount="indefinite"/>
  </line><text x="300" y="48" text-anchor="middle" class="footer-tagline">BUILD · LEARN · SECURE</text><text x="300" y="66" text-anchor="middle" class="footer-sub">Cybersecurity  |  Networking  |  Linux  |  Full Stack  |  WordPress</text><text x="300" y="86" text-anchor="middle" class="footer-name">Sahan Chathumina</text><line x1="40" y1="104" x2="560" y2="104" stroke="#1A2736" stroke-width="0.5"/><circle cx="300" cy="104" r="3" fill="#00FF88" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
  </circle></svg>