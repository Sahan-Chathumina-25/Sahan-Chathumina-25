<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1117"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="headerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="700" height="310" fill="url(#cardBg)" rx="10" stroke="#1A2736" stroke-width="1"/>

  <!-- Header -->
  <text x="350" y="28" text-anchor="middle" fill="#00D9FF" font-size="11" font-weight="700" letter-spacing="3" opacity="0.9">GITHUB STATISTICS</text>
  <line x1="250" y1="36" x2="450" y2="36" stroke="url(#headerLine)" stroke-width="0.5">
    <animate attributeName="x1" from="350" to="250" dur="1s" fill="freeze"/>
    <animate attributeName="x2" from="350" to="450" dur="1s" fill="freeze"/>
  </line>

  <!-- Left Card: Profile Stats -->
  <rect x="30" y="50" width="320" height="240" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
  <rect x="30" y="50" width="320" height="28" rx="8" fill="#111820"/>
  <rect x="30" y="70" width="320" height="8" fill="#111820"/>
  <text x="190" y="69" text-anchor="middle" fill="#EAF7FF" font-size="10" font-weight="600" letter-spacing="1">PROFILE STATS</text>

      <text x="55" y="100" fill="#7F95A5" font-size="11">Public Repos</text>
    <text x="300" y="100" text-anchor="end" fill="#EAF7FF" font-size="13" font-weight="700">1</text>
    <text x="55" y="122" fill="#7F95A5" font-size="11">Contributions</text>
    <text x="300" y="122" text-anchor="end" fill="#00FF88" font-size="13" font-weight="700">34 this year</text>
    <text x="55" y="144" fill="#7F95A5" font-size="11">Stars Earned</text>
    <text x="300" y="144" text-anchor="end" fill="#FFB800" font-size="13" font-weight="700">0</text>
    <text x="55" y="166" fill="#7F95A5" font-size="11">Followers</text>
    <text x="300" y="166" text-anchor="end" fill="#EAF7FF" font-size="13" font-weight="700">0</text>
    <text x="55" y="188" fill="#7F95A5" font-size="11">Forks</text>
    <text x="300" y="188" text-anchor="end" fill="#EAF7FF" font-size="13" font-weight="700">0</text>

  <!-- Right Card: Top Languages -->
  <rect x="360" y="50" width="310" height="240" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
  <rect x="360" y="50" width="310" height="28" rx="8" fill="#111820"/>
  <rect x="360" y="70" width="310" height="8" fill="#111820"/>
  <text x="515" y="69" text-anchor="middle" fill="#EAF7FF" font-size="10" font-weight="600" letter-spacing="1">TOP LANGUAGES</text>

      <text x="385" y="100" fill="#7F95A5" font-size="11">TypeScript</text>
    <rect x="470" y="93" width="180" height="8" rx="4" fill="#1A2736"/>
    <rect x="470" y="93" width="180.0" height="8" rx="4" fill="#3178c6">
      <animate attributeName="width" from="0" to="180.0" dur="1.5s" fill="freeze" begin="0.3s"/>
    </rect>
    <text x="660" y="100" text-anchor="end" fill="#EAF7FF" font-size="10">100.0%</text>

  <!-- Footer -->
  <text x="350" y="298" text-anchor="middle" fill="#7F95A5" font-size="8" opacity="0.6">Updated automatically &bull; GitHub API &bull; 2026-09-14</text>
</svg>