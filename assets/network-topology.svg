<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="700" height="320">
  <defs>
    <linearGradient id="nt-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#1479FF;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="nt-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Connections -->
  <g stroke="#00D9FF" stroke-width="1" opacity="0.2">
    <line x1="350" y1="40" x2="350" y2="100"/>
    <line x1="350" y1="100" x2="175" y2="170"/>
    <line x1="350" y1="100" x2="525" y2="170"/>
    <line x1="175" y1="170" x2="100" y2="260"/>
    <line x1="175" y1="170" x2="250" y2="260"/>
    <line x1="525" y1="170" x2="450" y2="260"/>
    <line x1="525" y1="170" x2="600" y2="260"/>
  </g>

  <!-- Animated packets -->
  <circle r="2" fill="#00D9FF" opacity="0.7" filter="url(#nt-glow)">
    <animateMotion dur="3s" repeatCount="indefinite" path="M350,40 L350,100 L175,170 L100,260"/>
  </circle>
  <circle r="2" fill="#1479FF" opacity="0.6" filter="url(#nt-glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M350,40 L350,100 L525,170 L600,260"/>
  </circle>

  <!-- Nodes -->
  <g filter="url(#nt-glow)">
    <circle cx="350" cy="40" r="18" fill="#0B1117" stroke="#00D9FF" stroke-width="1.5"/>
    <text x="350" y="44" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="9" fill="#00D9FF">INTERNET</text>

    <circle cx="350" cy="100" r="16" fill="#0B1117" stroke="#FFB800" stroke-width="1.5"/>
    <text x="350" y="104" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#FFB800">FIREWALL</text>

    <circle cx="175" cy="170" r="16" fill="#0B1117" stroke="#1479FF" stroke-width="1.5"/>
    <text x="175" y="174" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#1479FF">WEB SRV</text>

    <circle cx="525" cy="170" r="16" fill="#0B1117" stroke="#1479FF" stroke-width="1.5"/>
    <text x="525" y="174" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#1479FF">DNS</text>

    <circle cx="100" cy="260" r="14" fill="#0B1117" stroke="#7F95A5" stroke-width="1"/>
    <text x="100" y="264" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#7F95A5">SSH</text>

    <circle cx="250" cy="260" r="14" fill="#0B1117" stroke="#7F95A5" stroke-width="1"/>
    <text x="250" y="264" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#7F95A5">APACHE</text>

    <circle cx="450" cy="260" r="14" fill="#0B1117" stroke="#7F95A5" stroke-width="1"/>
    <text x="450" y="264" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#7F95A5">DHCP</text>

    <circle cx="600" cy="260" r="14" fill="#0B1117" stroke="#7F95A5" stroke-width="1"/>
    <text x="600" y="264" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#7F95A5">DB</text>
  </g>
</svg>