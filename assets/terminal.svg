<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" width="700" height="310"><defs><style>
    @keyframes cursorBlink { 0%,100%{opacity:1} 50%{opacity:0} }
    .term-prompt { font-family:'Courier New',monospace; font-size:12px; font-weight:700; fill:#00D9FF; }
    .term-cmd { font-family:'Courier New',monospace; font-size:12px; fill:#EAF7FF; }
    .term-output { font-family:'Courier New',monospace; font-size:11px; fill:#7F95A5; }
    .term-name { font-family:'Segoe UI',system-ui,sans-serif; font-size:13px; font-weight:600; fill:#EAF7FF; }
    .term-item { font-family:'Segoe UI',system-ui,sans-serif; font-size:10px; fill:#7F95A5; }
  </style></defs><rect width="700" height="310" fill="#0B1117" rx="8"/><rect width="700" height="28" rx="8" fill="#111820"/><rect x="0" y="20" width="700" height="8" fill="#111820"/><circle cx="18" cy="14" r="5" fill="#FF5F56"/><circle cx="36" cy="14" r="5" fill="#FFBD2E"/><circle cx="54" cy="14" r="5" fill="#27C93F"/><text x="350" y="18" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="10" fill="#7F95A5">terminal — whoami</text><rect width="700" height="310" fill="url(#scanline)" opacity="0.03"/><pattern id="scanline" patternUnits="userSpaceOnUse" width="4" height="4">
    <line x1="0" y1="0" x2="4" y2="0" stroke="#EAF7FF" stroke-width="0.5"/>
  </pattern><text x="20" y="54" class="term-prompt">$</text><text x="34" y="54" class="term-cmd">whoami</text><text x="120" y="54" class="term-output" fill="#7F95A5" opacity="0.5">#</text><text x="34" y="76" class="term-name">Sahan Chathumina</text><text x="34" y="92" class="term-output">Cybersecurity &amp; Network Engineering Student</text><text x="20" y="120" class="term-prompt">$</text><text x="34" y="120" class="term-cmd">focus</text><text x="34" y="138" class="term-item">→ Network Security</text><text x="34" y="152" class="term-item">→ Ethical Hacking</text><text x="34" y="166" class="term-item">→ Linux Administration</text><text x="34" y="180" class="term-item">→ Full Stack Development</text><text x="34" y="194" class="term-item">→ WordPress</text><text x="20" y="218" class="term-prompt">$</text><text x="34" y="218" class="term-cmd">stack</text><text x="34" y="236" class="term-output">Linux  ·  Networking  ·  Security  ·  WordPress  ·  Python  ·  Bash</text><text x="20" y="260" class="term-prompt">$</text><text x="34" y="260" class="term-cmd">status</text><circle cx="38" cy="275" r="3" fill="#00FF88" opacity="0.8"/><text x="46" y="278" class="term-item" fill="#00FF88">Learning</text><circle cx="116" cy="275" r="3" fill="#00D9FF" opacity="0.8"/><text x="124" y="278" class="term-item" fill="#00D9FF">Building</text><circle cx="194" cy="275" r="3" fill="#1479FF" opacity="0.8"/><text x="202" y="278" class="term-item" fill="#1479FF">Exploring</text><rect x="20" y="288" width="7" height="12" fill="#00D9FF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect><rect width="700" height="310" fill="none" stroke="#1A2736" stroke-width="1" rx="8"/></svg>