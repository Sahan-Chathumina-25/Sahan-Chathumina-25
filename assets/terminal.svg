<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <defs>
    <linearGradient id="t-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1117;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#05070A;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="t-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#1479FF;stop-opacity:0.2"/>
    </linearGradient>
    <linearGradient id="t-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#1479FF"/>
    </linearGradient>
    <filter id="t-glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="t-clip">
      <rect x="0" y="0" width="700" height="360" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#t-clip)">
    <rect width="700" height="360" rx="12" fill="url(#t-bg)"/>
    <rect width="700" height="360" rx="12" fill="none" stroke="url(#t-border)" stroke-width="1"/>

    <rect x="0" y="0" width="700" height="32" fill="#111820" opacity="0.8"/>
    <circle cx="18" cy="16" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="16" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="16" r="5" fill="#27C93F"/>
    <text x="350" y="20" text-anchor="middle" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="#7F95A5">terminal — cyberlab</text>

    <rect x="0" y="0" width="700" height="2" fill="#00D9FF" opacity="0.06">
      <animate attributeName="y" values="0;360;0" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g>
      <text x="20" y="55" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#00D9FF" opacity="0">
        $ whoami
        <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze"/>
      </text>
      <text x="20" y="75" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#EAF7FF" opacity="0">
        sahan.chathumina@cyberlab
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
      </text>
    </g>

    <g>
      <text x="20" y="115" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#00D9FF" opacity="0">
        $ identity
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
      </text>
      
      <text x="32" y="135" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" fill="#7F95A5" opacity="0">
        <tspan fill="#00D9FF" opacity="0.6">▸</tspan> Cybersecurity Student
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>
      </text>

      <text x="32" y="155" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" fill="#7F95A5" opacity="0">
        <tspan fill="#00D9FF" opacity="0.6">▸</tspan> Network Engineering
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.05s" fill="freeze"/>
      </text>

      <text x="32" y="175" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" fill="#7F95A5" opacity="0">
        <tspan fill="#00D9FF" opacity="0.6">▸</tspan> Linux
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.3s" fill="freeze"/>
      </text>

      <text x="32" y="195" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" fill="#7F95A5" opacity="0">
        <tspan fill="#00D9FF" opacity="0.6">▸</tspan> Full Stack Development
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.55s" fill="freeze"/>
      </text>
    </g>

    <g>
      <text x="20" y="255" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#00D9FF" opacity="0">
        $ stack
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
      </text>
      <text x="32" y="275" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="#7F95A5" opacity="0">
        WordPress  •  PHP  •  MySQL  •  HTML  •  CSS  •  JavaScript
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>
      </text>
    </g>

    <g>
      <text x="20" y="315" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#00D9FF" opacity="0">
        $ focus
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.8s" fill="freeze"/>
      </text>
      <text x="32" y="335" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="#7F95A5" opacity="0">
        Security  •  Networks  •  Systems  •  Web
        <animate attributeName="opacity" values="0;1" dur="0.4s" begin="3.1s" fill="freeze"/>
      </text>
    </g>

    <rect x="20" y="357" width="0" height="1" rx="0.5" fill="url(#t-accent)">
      <animate attributeName="width" from="0" to="350" dur="0.8s" begin="3.4s" fill="freeze"/>
    </rect>

    <g>
      <text x="20" y="395" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="13" fill="#00D9FF" opacity="0">
        $ status
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="3.8s" fill="freeze"/>
      </text>
      <g opacity="0">
        <circle cx="28" cy="411" r="4" fill="#00FF88" filter="url(#t-glow)"/>
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.1s" fill="freeze"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="4.4s"/>
      </g>
      <text x="40" y="415" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="12" fill="#EAF7FF" opacity="0">
        ● ONLINE
        <animate attributeName="opacity" values="0;1" dur="0.3s" begin="4.1s" fill="freeze"/>
      </text>
    </g>

    <rect x="20" y="455" width="7" height="14" fill="#00D9FF" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="1.2s" repeatCount="indefinite" begin="4.5s"/>
    </rect>
  </g>
</svg>