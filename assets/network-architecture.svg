<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="820" height="600">
  <defs>
    <linearGradient id="firewallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="secureGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    .layer-label { font-size: 8px; fill: #7F95A5; letter-spacing: 2; font-weight: 600; }
    .node-box { fill: #0B1117; stroke: #1A2736; stroke-width: 1; }
    .conn-line { stroke: #1A2736; stroke-width: 1.5; fill: none; }
    .packet { fill: #00D9FF; }
  </style>

  <!-- Background -->
  <rect width="820" height="600" fill="#05070A" rx="12"/>

  <!-- Title -->
  <text x="300" y="28" text-anchor="middle" fill="#00D9FF" font-size="11" font-weight="700" letter-spacing="4" opacity="0.8">NETWORK ARCHITECTURE</text>
  <line x1="180" y1="36" x2="420" y2="36" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>

  <!-- Layer labels -->
  <text x="30" y="82" class="layer-label" opacity="0.5">EXTERNAL</text>
  <text x="30" y="152" class="layer-label" opacity="0.5">SECURITY</text>
  <text x="30" y="222" class="layer-label" opacity="0.5">LOAD BALANCE</text>
  <text x="30" y="302" class="layer-label" opacity="0.5">WEB</text>
  <text x="30" y="382" class="layer-label" opacity="0.5">APPLICATION</text>
  <text x="30" y="452" class="layer-label" opacity="0.5">DATA</text>
  <text x="30" y="522" class="layer-label" opacity="0.5">BACKUP</text>

  <!-- SECURITY BOUNDARY -->
  <rect x="160" y="110" width="280" height="130" rx="8" fill="url(#secureGrad)" stroke="#00D9FF" stroke-width="0.5" stroke-dasharray="4 2" opacity="0.6"/>
  <text x="300" y="125" text-anchor="middle" fill="#00D9FF" font-size="7" font-weight="600" letter-spacing="2" opacity="0.4">SECURITY BOUNDARY</text>

  <!-- INTERNET -->
  <circle cx="300" cy="70" r="18" fill="#0B1117" stroke="#7F95A5" stroke-width="1.5"/>
  <text x="300" y="74" text-anchor="middle" fill="#EAF7FF" font-size="9" font-weight="600">WAN</text>
  <text x="300" y="50" text-anchor="middle" fill="#EAF7FF" font-size="12" font-weight="700">INTERNET</text>

  <!-- Connection: Internet → Firewall -->
  <line x1="300" y1="88" x2="300" y2="130" class="conn-line"/>

  <!-- EDGE FIREWALL -->
  <rect x="200" y="130" width="200" height="40" rx="6" fill="url(#firewallGrad)" stroke="#FF6B35" stroke-width="1"/>
  <text x="300" y="148" text-anchor="middle" fill="#FF6B35" font-size="10" font-weight="700">EDGE FIREWALL</text>
  <text x="300" y="162" text-anchor="middle" fill="#7F95A5" font-size="8">Security Gateway</text>

  <!-- Connection: Firewall → HAProxy -->
  <line x1="300" y1="170" x2="300" y2="200" class="conn-line"/>

  <!-- HAProxy -->
  <rect x="200" y="200" width="200" height="40" rx="6" class="node-box" stroke="#1479FF" stroke-width="1"/>
  <text x="300" y="218" text-anchor="middle" fill="#1479FF" font-size="10" font-weight="700">HAPROXY</text>
  <text x="300" y="232" text-anchor="middle" fill="#7F95A5" font-size="8">Load Balancer</text>

  <!-- Connection: HAProxy → Web Servers -->
  <line x1="300" y1="240" x2="300" y2="260" class="conn-line"/>
  <line x1="300" y1="260" x2="200" y2="260" class="conn-line"/>
  <line x1="300" y1="260" x2="400" y2="260" class="conn-line"/>
  <line x1="200" y1="260" x2="200" y2="280" class="conn-line"/>
  <line x1="400" y1="260" x2="400" y2="280" class="conn-line"/>

  <!-- Web Server 1 -->
  <rect x="120" y="280" width="160" height="40" rx="6" class="node-box"/>
  <text x="200" y="298" text-anchor="middle" fill="#EAF7FF" font-size="10" font-weight="600">WEB SERVER 1</text>
  <text x="200" y="312" text-anchor="middle" fill="#7F95A5" font-size="8">Apache</text>

  <!-- Web Server 2 -->
  <rect x="320" y="280" width="160" height="40" rx="6" class="node-box"/>
  <text x="400" y="298" text-anchor="middle" fill="#EAF7FF" font-size="10" font-weight="600">WEB SERVER 2</text>
  <text x="400" y="312" text-anchor="middle" fill="#7F95A5" font-size="8">Apache</text>

  <!-- Connection: Web → Application -->
  <line x1="200" y1="320" x2="200" y2="340" class="conn-line"/>
  <line x1="400" y1="320" x2="400" y2="340" class="conn-line"/>
  <line x1="200" y1="340" x2="300" y2="340" class="conn-line"/>
  <line x1="400" y1="340" x2="300" y2="340" class="conn-line"/>
  <line x1="300" y1="340" x2="300" y2="360" class="conn-line"/>

  <!-- Application Services -->
  <rect x="200" y="360" width="200" height="40" rx="6" class="node-box" stroke="#00FF88" stroke-width="1"/>
  <text x="300" y="378" text-anchor="middle" fill="#00FF88" font-size="10" font-weight="700">APPLICATION</text>
  <text x="300" y="392" text-anchor="middle" fill="#7F95A5" font-size="8">Services Layer</text>

  <!-- Connection: Application → Database -->
  <line x1="300" y1="400" x2="300" y2="430" class="conn-line"/>

  <!-- MySQL Database -->
  <rect x="200" y="430" width="200" height="40" rx="6" class="node-box" stroke="#FFB800" stroke-width="1"/>
  <text x="300" y="448" text-anchor="middle" fill="#FFB800" font-size="10" font-weight="700">MySQL DB</text>
  <text x="300" y="462" text-anchor="middle" fill="#7F95A5" font-size="8">Primary / Replica</text>

  <!-- Connection: Database → Backup -->
  <line x1="300" y1="470" x2="300" y2="500" class="conn-line"/>

  <!-- Backup / Logging -->
  <rect x="200" y="500" width="200" height="40" rx="6" class="node-box" stroke="#7F95A5" stroke-width="0.5"/>
  <text x="300" y="518" text-anchor="middle" fill="#7F95A5" font-size="10" font-weight="600">BACKUP / LOGGING</text>
  <text x="300" y="532" text-anchor="middle" fill="#7F95A5" font-size="8">Data Protection</text>

  <!-- ==================== SUPPORTING SERVICES ==================== -->
  <rect x="520" y="110" width="270" height="200" rx="8" fill="#0B1117" stroke="#1A2736" stroke-width="1"/>
  <text x="655" y="130" text-anchor="middle" fill="#7F95A5" font-size="8" font-weight="600" letter-spacing="2">SUPPORTING SERVICES</text>

  <!-- Row 1 -->
  <rect x="540" y="145" width="70" height="30" rx="4" fill="#1A2736" stroke="#00D9FF" stroke-width="0.5"/>
  <text x="575" y="164" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="600">DNS</text>

  <rect x="625" y="145" width="70" height="30" rx="4" fill="#1A2736" stroke="#00D9FF" stroke-width="0.5"/>
  <text x="660" y="164" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="600">DHCP</text>

  <rect x="710" y="145" width="70" height="30" rx="4" fill="#1A2736" stroke="#00FF88" stroke-width="0.5"/>
  <text x="745" y="164" text-anchor="middle" fill="#00FF88" font-size="9" font-weight="600">SSH</text>

  <!-- Row 2 -->
  <rect x="540" y="185" width="70" height="30" rx="4" fill="#1A2736" stroke="#1479FF" stroke-width="0.5"/>
  <text x="575" y="204" text-anchor="middle" fill="#1479FF" font-size="9" font-weight="600">TLS/SSL</text>

  <rect x="625" y="185" width="70" height="30" rx="4" fill="#1A2736" stroke="#1479FF" stroke-width="0.5"/>
  <text x="660" y="204" text-anchor="middle" fill="#1479FF" font-size="9" font-weight="600">VPN</text>

  <rect x="710" y="185" width="70" height="30" rx="4" fill="#1A2736" stroke="#FFB800" stroke-width="0.5"/>
  <text x="745" y="204" text-anchor="middle" fill="#FFB800" font-size="9" font-weight="600">MONITOR</text>

  <!-- Row 3 -->
  <rect x="540" y="225" width="70" height="30" rx="4" fill="#1A2736" stroke="#7F95A5" stroke-width="0.5"/>
  <text x="575" y="244" text-anchor="middle" fill="#7F95A5" font-size="9" font-weight="600">BACKUP</text>

  <rect x="625" y="225" width="70" height="30" rx="4" fill="#1A2736" stroke="#FF6B35" stroke-width="0.5"/>
  <text x="660" y="244" text-anchor="middle" fill="#FF6B35" font-size="9" font-weight="600">FIREWALL</text>

  <rect x="710" y="225" width="70" height="30" rx="4" fill="#1A2736" stroke="#7F95A5" stroke-width="0.5"/>
  <text x="745" y="244" text-anchor="middle" fill="#7F95A5" font-size="9" font-weight="600">LOGGING</text>

  <!-- Supporting services connection lines -->
  <line x1="520" y1="160" x2="400" y2="160" stroke="#1A2736" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/>
  <line x1="520" y1="200" x2="400" y2="220" stroke="#1A2736" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/>
  <line x1="520" y1="240" x2="400" y2="380" stroke="#1A2736" stroke-width="0.5" stroke-dasharray="3 2" opacity="0.4"/>

  <!-- ==================== ANIMATED PACKETS ==================== -->

  <!-- Packet 1: Internet → Firewall -->
  <circle r="4" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.0s"/>
    <animateMotion path="M300,70 L300,130" dur="1.5s" repeatCount="indefinite" begin="1.0s"/>
  </circle>

  <!-- Packet 2: Firewall → HAProxy -->
  <circle r="4" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="1.5s"/>
    <animateMotion path="M300,170 L300,200" dur="1.2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Packet 3: HAProxy → Web Server 1 -->
  <circle r="3" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.0s"/>
    <animateMotion path="M300,240 L200,260 L200,280" dur="1.8s" repeatCount="indefinite" begin="2.0s"/>
  </circle>

  <!-- Packet 4: HAProxy → Web Server 2 -->
  <circle r="3" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.2s"/>
    <animateMotion path="M300,240 L400,260 L400,280" dur="1.8s" repeatCount="indefinite" begin="2.2s"/>
  </circle>

  <!-- Packet 5: Web Server 1 → Application -->
  <circle r="3" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="2.8s"/>
    <animateMotion path="M200,320 L200,340 L300,340 L300,360" dur="1.5s" repeatCount="indefinite" begin="2.8s"/>
  </circle>

  <!-- Packet 6: Web Server 2 → Application -->
  <circle r="3" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.0s"/>
    <animateMotion path="M400,320 L400,340 L300,340 L300,360" dur="1.5s" repeatCount="indefinite" begin="3.0s"/>
  </circle>

  <!-- Packet 7: Application → Database -->
  <circle r="3" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="3.5s"/>
    <animateMotion path="M300,400 L300,430" dur="1.2s" repeatCount="indefinite" begin="3.5s"/>
  </circle>

  <!-- Packet 8: Database → Backup -->
  <circle r="3" class="packet" filter="url(#glow)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="4.0s"/>
    <animateMotion path="M300,470 L300,500" dur="1.0s" repeatCount="indefinite" begin="4.0s"/>
  </circle>

  <!-- Bottom accent -->
  <line x1="50" y1="570" x2="770" y2="570" stroke="#1A2736" stroke-width="1"/>
  <line x1="50" y1="570" x2="50" y2="570" stroke="#00D9FF" stroke-width="1" stroke-linecap="round">
    <animate attributeName="x2" from="50" to="770" dur="2s" fill="freeze" begin="0.5s"/>
  </line>
</svg>
