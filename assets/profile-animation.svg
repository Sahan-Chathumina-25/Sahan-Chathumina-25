<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="anim-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1321"/>
    </linearGradient>
    <linearGradient id="anim-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="anim-glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" fill="url(#anim-bg)"/>

  <!-- Grid -->
  <g opacity="0.03" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="100" y1="0" x2="100" y2="200"/><line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/><line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="500" y1="0" x2="500" y2="200"/><line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
  </g>

  <!-- Network -->
  <g filter="url(#anim-glow)">
    <g stroke="#00d4ff" stroke-width="0.8" opacity="0.12">
      <line x1="80" y1="60" x2="200" y2="40"/>
      <line x1="200" y1="40" x2="350" y2="70"/>
      <line x1="350" y1="70" x2="500" y2="50"/>
      <line x1="500" y1="50" x2="650" y2="80"/>
      <line x1="650" y1="80" x2="750" y2="55"/>
      <line x1="80" y1="60" x2="150" y2="150"/>
      <line x1="200" y1="40" x2="280" y2="160"/>
      <line x1="350" y1="70" x2="420" y2="170"/>
      <line x1="500" y1="50" x2="560" y2="160"/>
      <line x1="650" y1="80" x2="700" y2="155"/>
    </g>

    <circle r="2.5" fill="#00d4ff" filter="url(#anim-glow)" opacity="0.8">
      <animateMotion dur="5s" repeatCount="indefinite" path="M80,60 L200,40 L350,70 L500,50 L650,80 L750,55"/>
    </circle>
    <circle r="2" fill="#7b2ff7" filter="url(#anim-glow)" opacity="0.6">
      <animateMotion dur="6s" repeatCount="indefinite" path="M750,55 L650,80 L500,50 L350,70 L200,40 L80,60"/>
    </circle>

    <circle cx="80" cy="60" r="3" fill="#00d4ff" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="40" r="3" fill="#7b2ff7" opacity="0.5"/>
    <circle cx="350" cy="70" r="4" fill="#00d4ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="50" r="3" fill="#7b2ff7" opacity="0.5"/>
    <circle cx="650" cy="80" r="3" fill="#00d4ff" opacity="0.6"/>
    <circle cx="750" cy="55" r="3" fill="#7b2ff7" opacity="0.5"/>
  </g>

  <!-- Scan line -->
  <rect x="0" y="0" width="800" height="1" fill="url(#anim-accent)" opacity="0.2">
    <animate attributeName="y" values="0;200;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Cursor -->
  <g transform="translate(40, 180)" opacity="0.5">
    <text font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.3">$&gt;_</text>
    <rect x="72" y="-10" width="7" height="14" fill="#00d4ff" opacity="0.7">
      <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
