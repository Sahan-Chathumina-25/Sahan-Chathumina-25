<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" width="700" height="120">
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1479FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1117" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0B1117" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Panel background -->
  <rect x="20" y="8" width="660" height="104" rx="10" fill="url(#panel)" stroke="#1A2736" stroke-width="1"/>

  <!-- Subtle scanlines -->
  <g opacity="0.04">
    <line x1="20" y1="20" x2="680" y2="20" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="30" x2="680" y2="30" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="40" x2="680" y2="40" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="50" x2="680" y2="50" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="60" x2="680" y2="60" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="70" x2="680" y2="70" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="80" x2="680" y2="80" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="90" x2="680" y2="90" stroke="#00D9FF" stroke-width="0.5"/>
    <line x1="20" y1="100" x2="680" y2="100" stroke="#00D9FF" stroke-width="0.5"/>
  </g>

  <!-- Left accent bar -->
  <rect x="20" y="8" width="3" height="104" rx="1" fill="#00D9FF" opacity="0">
    <animate attributeName="opacity" from="0" to="0.8" dur="0.8s" fill="freeze" begin="0.3s"/>
  </rect>

  <!-- Top accent line drawing -->
  <line x1="30" y1="14" x2="30" y2="14" stroke="url(#accent)" stroke-width="1" stroke-linecap="round">
    <animate attributeName="x2" from="30" to="670" dur="1.2s" fill="freeze" begin="0.2s"/>
  </line>

  <!-- Name -->
  <text x="50" y="42" fill="#EAF7FF" font-size="16" font-weight="700" opacity="0">
    SAHAN CHATHUMINA
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="0.6s"/>
  </text>

  <!-- Role line -->
  <text x="50" y="60" fill="#00D9FF" font-size="10" font-weight="600" letter-spacing="1" opacity="0">
    CYBERSECURITY · NETWORKING · LINUX · FULL STACK
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="0.8s"/>
  </text>

  <!-- Focus pills -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.0s"/>
    <rect x="50" y="72" width="72" height="20" rx="4" fill="#1A2736" stroke="#1479FF" stroke-width="0.5"/>
    <text x="86" y="85" text-anchor="middle" fill="#1479FF" font-size="8" font-weight="600">Security</text>
    <rect x="130" y="72" width="80" height="20" rx="4" fill="#1A2736" stroke="#00D9FF" stroke-width="0.5"/>
    <text x="170" y="85" text-anchor="middle" fill="#00D9FF" font-size="8" font-weight="600">Networking</text>
    <rect x="218" y="72" width="56" height="20" rx="4" fill="#1A2736" stroke="#00FF88" stroke-width="0.5"/>
    <text x="246" y="85" text-anchor="middle" fill="#00FF88" font-size="8" font-weight="600">Linux</text>
    <rect x="282" y="72" width="96" height="20" rx="4" fill="#1A2736" stroke="#1479FF" stroke-width="0.5"/>
    <text x="330" y="85" text-anchor="middle" fill="#1479FF" font-size="8" font-weight="600">Full Stack</text>
    <rect x="386" y="72" width="80" height="20" rx="4" fill="#1A2736" stroke="#00D9FF" stroke-width="0.5"/>
    <text x="426" y="85" text-anchor="middle" fill="#00D9FF" font-size="8" font-weight="600">WordPress</text>
  </g>

  <!-- Bottom accent -->
  <line x1="30" y1="108" x2="30" y2="108" stroke="url(#accent)" stroke-width="1" stroke-linecap="round">
    <animate attributeName="x2" from="30" to="670" dur="1.2s" fill="freeze" begin="0.4s"/>
  </line>

  <!-- Right accent bar -->
  <rect x="677" y="8" width="3" height="104" rx="1" fill="#1479FF" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" dur="0.8s" fill="freeze" begin="0.5s"/>
  </rect>
</svg>
