<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#1479FF"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#FFB800"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="500" fill="#0B1117" rx="10"/>

  <!-- Section Title -->
  <text x="40" y="36" fill="#EAF7FF" font-size="16" font-weight="700">CYBERSECURITY LAB</text>
  <text x="40" y="54" fill="#7F95A5" font-size="11">Security Practice &amp; Offensive/Defensive Lab</text>
  <line x1="40" y1="64" x2="200" y2="64" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>

  <!-- ===== TOP ROW: 3 Lab Category Cards ===== -->

  <!-- Card 1: Network Security -->
  <g>
    <rect x="40" y="80" width="230" height="140" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
    <rect x="40" y="80" width="3" height="140" rx="1.5" fill="url(#accent1)"/>
    <text x="58" y="106" fill="#EAF7FF" font-size="13" font-weight="700">Network Security</text>
    <text x="58" y="124" fill="#7F95A5" font-size="10">Firewall configuration,</text>
    <text x="58" y="138" fill="#7F95A5" font-size="10">traffic analysis, network</text>
    <text x="58" y="152" fill="#7F95A5" font-size="10">monitoring</text>
    <!-- Tool pills -->
    <rect x="58" y="170" width="58" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="87" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">firewalld</text>
    <rect x="122" y="170" width="58" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="151" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">Wireshark</text>
    <rect x="186" y="170" width="56" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="214" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">tcpdump</text>
    <!-- Status -->
    <circle cx="58" y="208" r="3" fill="#00FF88" cy="208"/>
    <text x="66" y="212" fill="#00FF88" font-size="9" font-weight="600">Active</text>
  </g>

  <!-- Card 2: Web Security -->
  <g>
    <rect x="286" y="80" width="230" height="140" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
    <rect x="286" y="80" width="3" height="140" rx="1.5" fill="url(#accent1)"/>
    <text x="304" y="106" fill="#EAF7FF" font-size="13" font-weight="700">Web Security</text>
    <text x="304" y="124" fill="#7F95A5" font-size="10">Web application security,</text>
    <text x="304" y="138" fill="#7F95A5" font-size="10">HTTP analysis, security</text>
    <text x="304" y="152" fill="#7F95A5" font-size="10">testing</text>
    <rect x="304" y="170" width="62" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="335" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">Burp Suite</text>
    <rect x="372" y="170" width="48" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="396" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">OWASP</text>
    <rect x="426" y="170" width="48" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="450" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">HTTP</text>
    <circle cx="304" cy="208" r="3" fill="#00FF88"/>
    <text x="312" y="212" fill="#00FF88" font-size="9" font-weight="600">Active</text>
  </g>

  <!-- Card 3: Security Automation -->
  <g>
    <rect x="532" y="80" width="230" height="140" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
    <rect x="532" y="80" width="3" height="140" rx="1.5" fill="url(#accent1)"/>
    <text x="550" y="106" fill="#EAF7FF" font-size="13" font-weight="700">Security Automation</text>
    <text x="550" y="124" fill="#7F95A5" font-size="10">Python scripts for scanning,</text>
    <text x="550" y="138" fill="#7F95A5" font-size="10">port detection, automation</text>
    <rect x="550" y="170" width="52" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="576" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">Python</text>
    <rect x="608" y="170" width="52" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="634" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">Nmap</text>
    <rect x="666" y="170" width="48" height="20" rx="10" fill="#111820" stroke="#1A2736" stroke-width="0.5"/>
    <text x="690" y="184" text-anchor="middle" fill="#00D9FF" font-size="9" font-weight="500">Bash</text>
    <circle cx="550" cy="208" r="3" fill="#FFB800"/>
    <text x="558" y="212" fill="#FFB800" font-size="9" font-weight="600">Building</text>
  </g>

  <!-- ===== BOTTOM ROW: CTF / Security Challenges ===== -->

  <!-- Section divider -->
  <line x1="40" y1="245" x2="760" y2="245" stroke="#1A2736" stroke-width="1"/>
  <text x="40" y="270" fill="#7F95A5" font-size="10" font-weight="600" letter-spacing="2">CTF / SECURITY CHALLENGES</text>

  <!-- CTF Card 1: Web Exploitation -->
  <g>
    <rect x="40" y="288" width="230" height="180" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
    <rect x="40" y="288" width="230" height="4" rx="2" fill="#FF6B35" opacity="0.6"/>
    <!-- Platform badge -->
    <rect x="58" y="304" width="60" height="18" rx="4" fill="#1A2736" stroke="#FF6B35" stroke-width="0.5"/>
    <text x="88" y="316" text-anchor="middle" fill="#FF6B35" font-size="8" font-weight="600">TryHackMe</text>
    <!-- Title -->
    <text x="58" y="344" fill="#EAF7FF" font-size="14" font-weight="700">Web Exploitation</text>
    <!-- Description -->
    <text x="58" y="364" fill="#7F95A5" font-size="10">Various web security challenges</text>
    <text x="58" y="378" fill="#7F95A5" font-size="10">covering XSS, SQLi, and more</text>
    <!-- Difficulty bar -->
    <rect x="58" y="400" width="120" height="6" rx="3" fill="#1A2736"/>
    <rect x="58" y="400" width="72" height="6" rx="3" fill="#FFB800"/>
    <text x="188" y="408" fill="#7F95A5" font-size="9">Easy - Medium</text>
    <!-- Skills -->
    <text x="58" y="436" fill="#7F95A5" font-size="9">Skills:</text>
    <text x="96" y="436" fill="#00D9FF" font-size="9">XSS, SQLi, HTTP</text>
    <!-- Status -->
    <circle cx="58" cy="456" r="3" fill="#FFB800"/>
    <text x="66" y="460" fill="#FFB800" font-size="9" font-weight="600">In Progress</text>
  </g>

  <!-- CTF Card 2: Forensics -->
  <g>
    <rect x="286" y="288" width="230" height="180" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
    <rect x="286" y="288" width="230" height="4" rx="2" fill="#1479FF" opacity="0.6"/>
    <rect x="304" y="304" width="60" height="18" rx="4" fill="#1A2736" stroke="#1479FF" stroke-width="0.5"/>
    <text x="334" y="316" text-anchor="middle" fill="#1479FF" font-size="8" font-weight="600">TryHackMe</text>
    <text x="304" y="344" fill="#EAF7FF" font-size="14" font-weight="700">Forensics</text>
    <text x="304" y="364" fill="#7F95A5" font-size="10">File analysis and memory</text>
    <text x="304" y="378" fill="#7F95A5" font-size="10">forensics challenges</text>
    <rect x="304" y="400" width="120" height="6" rx="3" fill="#1A2736"/>
    <rect x="304" y="400" width="48" height="6" rx="3" fill="#00FF88"/>
    <text x="434" y="408" fill="#7F95A5" font-size="9">Easy</text>
    <text x="304" y="436" fill="#7F95A5" font-size="9">Skills:</text>
    <text x="342" y="436" fill="#00D9FF" font-size="9">File Analysis, Memory</text>
    <circle cx="304" cy="456" r="3" fill="#00FF88"/>
    <text x="312" y="460" fill="#00FF88" font-size="9" font-weight="600">Completed</text>
  </g>

  <!-- CTF Card 3: Cryptography -->
  <g>
    <rect x="532" y="288" width="230" height="180" rx="8" fill="#05070A" stroke="#1A2736" stroke-width="1"/>
    <rect x="532" y="288" width="230" height="4" rx="2" fill="#00FF88" opacity="0.6"/>
    <rect x="550" y="304" width="52" height="18" rx="4" fill="#1A2736" stroke="#00FF88" stroke-width="0.5"/>
    <text x="576" y="316" text-anchor="middle" fill="#00FF88" font-size="8" font-weight="600">PicoCTF</text>
    <text x="550" y="344" fill="#EAF7FF" font-size="14" font-weight="700">Cryptography</text>
    <text x="550" y="364" fill="#7F95A5" font-size="10">Basic cryptography challenges</text>
    <text x="550" y="378" fill="#7F95A5" font-size="10">covering ciphers and encoding</text>
    <rect x="550" y="400" width="120" height="6" rx="3" fill="#1A2736"/>
    <rect x="550" y="400" width="72" height="6" rx="3" fill="#FFB800"/>
    <text x="680" y="408" fill="#7F95A5" font-size="9">Easy - Medium</text>
    <text x="550" y="436" fill="#7F95A5" font-size="9">Skills:</text>
    <text x="588" y="436" fill="#00D9FF" font-size="9">Ciphers, Encoding</text>
    <circle cx="550" cy="456" r="3" fill="#FFB800"/>
    <text x="558" y="460" fill="#FFB800" font-size="9" font-weight="600">In Progress</text>
  </g>
</svg>
