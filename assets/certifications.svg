<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520">
  <line x1="40" y1="10" x2="40" y2="510" stroke="#1A2736" stroke-width="1" opacity="0.2"/>
  
  <!-- Red Hat System Administration I -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0s" fill="freeze"/>

    

    <circle cx="40" cy="30" r="7" fill="#05070A" stroke="#00FF88" stroke-width="2"/>
    <circle cx="40" cy="30" r="3" fill="#00FF88" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0s"/>
    </circle>

    <rect x="50" y="16" width="630" height="56" rx="10" fill="#0B1117" opacity="0.7"/>
    <rect x="50" y="16" width="630" height="56" rx="10" fill="none" stroke="#1A2736" stroke-width="0.5"/>

    <rect x="50" y="26" width="2" height="36" rx="1" fill="#00FF88" opacity="0.5"/>

    <text x="66" y="34" font-family="'SF Mono','Consolas',monospace" font-size="11" font-weight="600" fill="#00FF88">2026</text>
    <text x="66" y="52" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAF7FF">Red Hat System Administration I</text>
    <text x="66" y="66" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="11" fill="#7F95A5">Red Hat</text>

    <rect x="560" y="34" width="76" height="22" rx="11" fill="#111820" stroke="#00FF88" stroke-width="0.8" opacity="0.8"/>
    <text x="598" y="49" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#00FF88" letter-spacing="0.5">COMPLETED</text>
  </g>

  <!-- CCNA Header -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.2s" fill="freeze"/>

    <circle cx="40" cy="110" r="10" fill="#05070A" stroke="#00FF88" stroke-width="2"/>
    <circle cx="40" cy="110" r="4" fill="#00FF88" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <rect x="50" y="92" width="630" height="36" rx="8" fill="#0B1117" opacity="0.7"/>
    <rect x="50" y="92" width="630" height="36" rx="8" fill="none" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>

    <text x="66" y="112" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="15" font-weight="700" fill="#EAF7FF">CCNA</text>
    <text x="634" y="112" text-anchor="end" font-family="'SF Mono','Consolas',monospace" font-size="10" fill="#7F95A5">2026</text>
  </g>

  <!-- Module 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.4s" fill="freeze"/>

    <line x1="40" y1="140" x2="40" y2="180" stroke="#1A2736" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

    <circle cx="40" cy="190" r="6" fill="#05070A" stroke="#00FF88" stroke-width="1.5"/>
    <circle cx="40" cy="190" r="2.5" fill="#00FF88" opacity="0.8"/>

    <rect x="70" y="176" width="610" height="56" rx="8" fill="#0B1117" opacity="0.6"/>
    <rect x="70" y="176" width="610" height="56" rx="8" fill="none" stroke="#1A2736" stroke-width="0.5"/>

    <rect x="70" y="186" width="2" height="36" rx="1" fill="#00FF88" opacity="0.5"/>

    <text x="86" y="192" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#00FF88" letter-spacing="1" opacity="0.7">Module 01</text>
    <text x="86" y="208" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="12" font-weight="600" fill="#EAF7FF">Introduction to Networks</text>

    <rect x="550" y="192" width="80" height="20" rx="10" fill="#111820" stroke="#00FF88" stroke-width="0.8" opacity="0.8"/>
    <text x="590" y="206" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#00FF88" letter-spacing="0.5">COMPLETED</text>
  </g>

  <!-- Module 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.6000000000000001s" fill="freeze"/>

    <line x1="40" y1="220" x2="40" y2="260" stroke="#1A2736" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

    <circle cx="40" cy="270" r="6" fill="#05070A" stroke="#00FF88" stroke-width="1.5"/>
    <circle cx="40" cy="270" r="2.5" fill="#00FF88" opacity="0.8"/>

    <rect x="70" y="256" width="610" height="56" rx="8" fill="#0B1117" opacity="0.6"/>
    <rect x="70" y="256" width="610" height="56" rx="8" fill="none" stroke="#1A2736" stroke-width="0.5"/>

    <rect x="70" y="266" width="2" height="36" rx="1" fill="#00FF88" opacity="0.5"/>

    <text x="86" y="272" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#00FF88" letter-spacing="1" opacity="0.7">Module 02</text>
    <text x="86" y="288" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="12" font-weight="600" fill="#EAF7FF">Switching, Routing &amp; Wireless Essentials</text>

    <rect x="550" y="272" width="80" height="20" rx="10" fill="#111820" stroke="#00FF88" stroke-width="0.8" opacity="0.8"/>
    <text x="590" y="286" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#00FF88" letter-spacing="0.5">COMPLETED</text>
  </g>

  <!-- Module 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.8s" fill="freeze"/>

    <line x1="40" y1="300" x2="40" y2="340" stroke="#1A2736" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

    <circle cx="40" cy="350" r="6" fill="#05070A" stroke="#00FF88" stroke-width="1.5"/>
    <circle cx="40" cy="350" r="2.5" fill="#00FF88" opacity="0.8"/>

    <rect x="70" y="336" width="610" height="56" rx="8" fill="#0B1117" opacity="0.6"/>
    <rect x="70" y="336" width="610" height="56" rx="8" fill="none" stroke="#1A2736" stroke-width="0.5"/>

    <rect x="70" y="346" width="2" height="36" rx="1" fill="#00FF88" opacity="0.5"/>

    <text x="86" y="352" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#00FF88" letter-spacing="1" opacity="0.7">Module 03</text>
    <text x="86" y="368" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="12" font-weight="600" fill="#EAF7FF">Enterprise Networking, Security &amp; Automation</text>

    <rect x="550" y="352" width="80" height="20" rx="10" fill="#111820" stroke="#00FF88" stroke-width="0.8" opacity="0.8"/>
    <text x="590" y="366" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="7" fill="#00FF88" letter-spacing="0.5">COMPLETED</text>
  </g>

  <!-- Diploma in English -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1s" fill="freeze"/>

    <line x1="40" y1="380" x2="40" y2="420" stroke="#1A2736" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3"/>

    <circle cx="40" cy="430" r="7" fill="#05070A" stroke="#00FF88" stroke-width="2"/>
    <circle cx="40" cy="430" r="3" fill="#00FF88" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>

    <rect x="50" y="416" width="630" height="56" rx="10" fill="#0B1117" opacity="0.7"/>
    <rect x="50" y="416" width="630" height="56" rx="10" fill="none" stroke="#1A2736" stroke-width="0.5"/>

    <rect x="50" y="426" width="2" height="36" rx="1" fill="#00FF88" opacity="0.5"/>

    <text x="66" y="434" font-family="'SF Mono','Consolas',monospace" font-size="11" font-weight="600" fill="#00FF88">2025</text>
    <text x="66" y="452" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="14" font-weight="600" fill="#EAF7FF">Diploma in English</text>
    <text x="66" y="466" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="11" fill="#7F95A5">Academy - English in Seven Boxes</text>

    <rect x="560" y="434" width="76" height="22" rx="11" fill="#111820" stroke="#00FF88" stroke-width="0.8" opacity="0.8"/>
    <text x="598" y="449" text-anchor="middle" font-family="'SF Mono','Consolas',monospace" font-size="8" fill="#00FF88" letter-spacing="0.5">COMPLETED</text>
  </g>
</svg>