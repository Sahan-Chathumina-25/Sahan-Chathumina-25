<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="600" height="80">
  <defs>
    <linearGradient id="fa-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#1479FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.6"/>
    </linearGradient>
  </defs>

  <line x1="50" y1="40" x2="550" y2="40" stroke="#1A2736" stroke-width="0.5" opacity="0.3"/>
  <line x1="50" y1="40" x2="50" y2="40" stroke="url(#fa-accent)" stroke-width="1.5">
    <animate attributeName="x2" values="50;550;50" dur="4s" repeatCount="indefinite"/>
  </line>

  <circle cx="300" cy="40" r="3" fill="#00D9FF" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>