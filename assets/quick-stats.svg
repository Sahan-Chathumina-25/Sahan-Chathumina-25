<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 50" width="400" height="50">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1117"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', system-ui, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="400" height="50" fill="url(#bg)" rx="8" stroke="#1A2736" stroke-width="1"/>

  <!-- Followers -->
  <g transform="translate(20, 25)">
    <circle cx="0" cy="0" r="4" fill="#00D9FF"/>
    <text x="12" y="4" fill="#7F95A5" font-size="10">Followers</text>
    <text x="80" y="4" fill="#EAF7FF" font-size="13" font-weight="700" id="followers">__</text>
  </g>

  <!-- Stars -->
  <g transform="translate(150, 25)">
    <circle cx="0" cy="0" r="4" fill="#FFB800"/>
    <text x="12" y="4" fill="#7F95A5" font-size="10">Stars</text>
    <text x="60" y="4" fill="#EAF7FF" font-size="13" font-weight="700" id="stars">__</text>
  </g>

  <!-- Forks -->
  <g transform="translate(270, 25)">
    <circle cx="0" cy="0" r="4" fill="#1479FF"/>
    <text x="12" y="4" fill="#7F95A5" font-size="10">Forks</text>
    <text x="55" y="4" fill="#EAF7FF" font-size="13" font-weight="700" id="forks">__</text>
  </g>

  <!-- Subtle line -->
  <line x1="140" y1="12" x2="140" y2="38" stroke="#1A2736" stroke-width="1"/>
  <line x1="260" y1="12" x2="260" y2="38" stroke="#1A2736" stroke-width="1"/>
</svg>
