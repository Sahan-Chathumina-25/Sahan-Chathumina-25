      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <text x="252" y="226" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="#EAF7FF">NETWORKING</text>

    <rect x="406" y="205" width="165" height="34" rx="8" fill="#111820" stroke="#1A2736" stroke-width="0.5" opacity="0.85"/>
    <circle cx="420" cy="222" r="3" fill="#00D9FF" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <text x="430" y="226" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="#EAF7FF">LINUX</text>

    <rect x="584" y="205" width="165" height="34" rx="8" fill="#111820" stroke="#1A2736" stroke-width="0.5" opacity="0.85"/>
    <circle cx="598" cy="222" r="3" fill="#00D9FF" opacity="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <text x="608" y="226" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="11" fill="#EAF7FF">FULL STACK</text>

    <line x1="54" y1="255" x2="746" y2="255" stroke="#1A2736" stroke-width="0.5" opacity="0.3"/>

    
    <text x="50" y="272" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10" fill="#7F95A5" letter-spacing="1">FOCUS</text>
    <text x="50" y="296" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="16" font-weight="700" fill="#EAF7FF">Security</text>

    <text x="225" y="272" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10" fill="#7F95A5" letter-spacing="1">SYSTEMS</text>
    <text x="225" y="296" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="16" font-weight="700" fill="#EAF7FF">Linux</text>

    <text x="400" y="272" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10" fill="#7F95A5" letter-spacing="1">STACK</text>
    <text x="400" y="296" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="16" font-weight="700" fill="#EAF7FF">WordPress</text>

    <text x="575" y="272" font-family="'SF Mono','Cascadia Code','Consolas',monospace" font-size="10" fill="#7F95A5" letter-spacing="1">STATUS</text>
    <text x="575" y="296" font-family="'Segoe UI','Inter',Arial,sans-serif" font-size="16" font-weight="700" fill="#EAF7FF">Learning</text>

    <rect x="670" y="308" width="80" height="2" rx="1" fill="url(#ab-accent)" opacity="0.4"/>

    <path d="M 44 34 L 42 34 L 34 42 L 34 44" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.3"/>
    <path d="M 756 306 L 758 306 L 766 298 L 766 296" fill="none" stroke="#00D9FF" stroke-width="0.5" opacity="0.3"/>

    <rect x="0" y="0" width="800" height="1.5" fill="#00D9FF" opacity="0.06">
      <animate attributeName="y" values="0;340;0" dur="8s" repeatCount="indefinite"/>
