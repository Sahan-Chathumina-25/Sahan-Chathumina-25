<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="gCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#1479FF"/>
    </linearGradient>
    <linearGradient id="gNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1479FF"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="gLinux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <linearGradient id="gFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1479FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="800" height="420" fill="#0B1117" rx="12"/>

  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" fill="#00D9FF" font-size="12" font-weight="700" letter-spacing="5" opacity="0.9">SKILL OVERVIEW</text>
  <line x1="280" y1="44" x2="520" y2="44" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>

  <!-- ===== Circle 1: Cybersecurity (45%) ===== -->
  <g transform="translate(150,210)">
    <!-- Outer ring background -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A2736" stroke-width="6"/>
    <!-- Outer ring reveal — 45% of circumference (503) = 226 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#gCyber)" stroke-width="6"
            stroke-dasharray="226 503" stroke-dashoffset="503" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="503" to="0" dur="2s" fill="freeze" begin="0.3s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <!-- Inner ring background -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1A2736" stroke-width="2.5"/>
    <!-- Inner ring reveal — 45% of 402 = 181 -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#00D9FF" stroke-width="2.5"
            stroke-dasharray="181 402" stroke-dashoffset="402" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="402" to="0" dur="1.8s" fill="freeze" begin="0.6s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <!-- Center glow -->
    <circle cx="0" cy="0" r="24" fill="#00D9FF" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" dur="1s" fill="freeze" begin="1.0s"/>
    </circle>
    <!-- Percentage number -->
    <text x="0" y="8" text-anchor="middle" fill="#EAF7FF" font-size="34" font-weight="700" opacity="0">
      45
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.2s"/>
    </text>
    <text x="22" y="16" fill="#00D9FF" font-size="14" font-weight="600" opacity="0">
      %
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.2s"/>
    </text>
    <!-- Category label -->
    <text x="0" y="108" text-anchor="middle" fill="#EAF7FF" font-size="13" font-weight="700" opacity="0">
      CYBERSECURITY
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.6s"/>
    </text>
    <!-- Tech labels -->
    <text x="0" y="126" text-anchor="middle" fill="#7F95A5" font-size="9" opacity="0">
      Ethical Hacking · Network Security · CTF
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.8s"/>
    </text>
  </g>

  <!-- ===== Circle 2: Networking (60%) ===== -->
  <g transform="translate(317,210)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A2736" stroke-width="6"/>
    <!-- 60% of 503 = 302 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#gNet)" stroke-width="6"
            stroke-dasharray="302 503" stroke-dashoffset="503" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="503" to="0" dur="2s" fill="freeze" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1A2736" stroke-width="2.5"/>
    <!-- 60% of 402 = 241 -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1479FF" stroke-width="2.5"
            stroke-dasharray="241 402" stroke-dashoffset="402" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="402" to="0" dur="1.8s" fill="freeze" begin="0.8s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <circle cx="0" cy="0" r="24" fill="#1479FF" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" dur="1s" fill="freeze" begin="1.2s"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" fill="#EAF7FF" font-size="34" font-weight="700" opacity="0">
      60
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </text>
    <text x="22" y="16" fill="#1479FF" font-size="14" font-weight="600" opacity="0">
      %
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </text>
    <text x="0" y="108" text-anchor="middle" fill="#EAF7FF" font-size="13" font-weight="700" opacity="0">
      NETWORKING
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.8s"/>
    </text>
    <text x="0" y="126" text-anchor="middle" fill="#7F95A5" font-size="9" opacity="0">
      TCP/IP · DNS · DHCP · Routing · VPN
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.0s"/>
    </text>
  </g>

  <!-- ===== Circle 3: Linux & Systems (60%) ===== -->
  <g transform="translate(483,210)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A2736" stroke-width="6"/>
    <!-- 60% of 503 = 302 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#gLinux)" stroke-width="6"
            stroke-dasharray="302 503" stroke-dashoffset="503" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="503" to="0" dur="2s" fill="freeze" begin="0.7s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1A2736" stroke-width="2.5"/>
    <!-- 60% of 402 = 241 -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#00FF88" stroke-width="2.5"
            stroke-dasharray="241 402" stroke-dashoffset="402" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="402" to="0" dur="1.8s" fill="freeze" begin="1.0s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <circle cx="0" cy="0" r="24" fill="#00FF88" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" dur="1s" fill="freeze" begin="1.4s"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" fill="#EAF7FF" font-size="34" font-weight="700" opacity="0">
      60
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.6s"/>
    </text>
    <text x="22" y="16" fill="#00FF88" font-size="14" font-weight="600" opacity="0">
      %
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.6s"/>
    </text>
    <text x="0" y="108" text-anchor="middle" fill="#EAF7FF" font-size="13" font-weight="700" opacity="0">
      LINUX &amp; SYSTEMS
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.0s"/>
    </text>
    <text x="0" y="126" text-anchor="middle" fill="#7F95A5" font-size="9" opacity="0">
      CentOS · SSH · Apache · Bash · SELinux
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.2s"/>
    </text>
  </g>

  <!-- ===== Circle 4: Full Stack (75%) ===== -->
  <g transform="translate(650,210)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1A2736" stroke-width="6"/>
    <!-- 75% of 503 = 377 -->
    <circle cx="0" cy="0" r="80" fill="none" stroke="url(#gFull)" stroke-width="6"
            stroke-dasharray="377 503" stroke-dashoffset="503" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="503" to="0" dur="2s" fill="freeze" begin="0.9s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1A2736" stroke-width="2.5"/>
    <!-- 75% of 402 = 302 -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="#1479FF" stroke-width="2.5"
            stroke-dasharray="302 402" stroke-dashoffset="402" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="402" to="0" dur="1.8s" fill="freeze" begin="1.2s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </circle>
    <circle cx="0" cy="0" r="24" fill="#1479FF" opacity="0">
      <animate attributeName="opacity" from="0" to="0.1" dur="1s" fill="freeze" begin="1.6s"/>
    </circle>
    <text x="0" y="8" text-anchor="middle" fill="#EAF7FF" font-size="34" font-weight="700" opacity="0">
      75
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.8s"/>
    </text>
    <text x="22" y="16" fill="#1479FF" font-size="14" font-weight="600" opacity="0">
      %
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.8s"/>
    </text>
    <text x="0" y="108" text-anchor="middle" fill="#EAF7FF" font-size="13" font-weight="700" opacity="0">
      FULL STACK
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.2s"/>
    </text>
    <text x="0" y="126" text-anchor="middle" fill="#7F95A5" font-size="9" opacity="0">
      WordPress · HTML · CSS · JS · PHP · MySQL
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.4s"/>
    </text>
  </g>

  <!-- Bottom accent line -->
  <line x1="60" y1="395" x2="740" y2="395" stroke="#1A2736" stroke-width="1"/>
  <line x1="60" y1="395" x2="60" y2="395" stroke="#00D9FF" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="x2" from="60" to="740" dur="2s" fill="freeze" begin="0.5s"/>
  </line>
</svg>
