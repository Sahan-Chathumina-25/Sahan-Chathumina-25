<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <linearGradient id="gCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#1479FF"/>
    </linearGradient>
    <linearGradient id="gNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1479FF"/>
      <stop offset="100%" stop-color="#00D9FF"/>
    </linearGradient>
    <linearGradient id="gLinux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
    <linearGradient id="gFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1479FF"/>
      <stop offset="100%" stop-color="#00FF88"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="700" height="400" fill="#0B1117" rx="12"/>

  <!-- Title -->
  <text x="350" y="32" text-anchor="middle" fill="#00D9FF" font-size="11" font-weight="700" letter-spacing="4" opacity="0.8">SKILL OVERVIEW</text>
  <line x1="250" y1="40" x2="450" y2="40" stroke="#00D9FF" stroke-width="1" opacity="0.3"/>

  <!-- Circle 1: Cybersecurity -->
  <g transform="translate(120,195)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1A2736" stroke-width="4"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#gCyber)" stroke-width="4"
            stroke-dasharray="452" stroke-dashoffset="452" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="452" to="0" dur="1.8s" fill="freeze" begin="0.2s"/>
    </circle>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#1A2736" stroke-width="2"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00D9FF" stroke-width="2"
            stroke-dasharray="364" stroke-dashoffset="364" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="364" to="0" dur="1.5s" fill="freeze" begin="0.5s"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#00D9FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.2s"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" fill="#00D9FF" font-size="18" font-weight="700" opacity="0">C</text>
    <text x="0" y="12" text-anchor="middle" fill="#7F95A5" font-size="8" font-weight="600" letter-spacing="1" opacity="0">SHIELD</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" fill="freeze" begin="1.0s"/>
    <set attributeName="opacity" to="1" begin="1.0s"/>
    <text x="0" y="95" text-anchor="middle" fill="#EAF7FF" font-size="11" font-weight="600" opacity="0">
      CYBERSECURITY
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.4s"/>
    </text>
    <text x="0" y="110" text-anchor="middle" fill="#7F95A5" font-size="7" opacity="0">
      Ethical Hacking · Network Security · CTF
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.6s"/>
    </text>
  </g>

  <!-- Circle 2: Networking -->
  <g transform="translate(265,195)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1A2736" stroke-width="4"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#gNet)" stroke-width="4"
            stroke-dasharray="452" stroke-dashoffset="452" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="452" to="0" dur="1.8s" fill="freeze" begin="0.4s"/>
    </circle>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#1A2736" stroke-width="2"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#1479FF" stroke-width="2"
            stroke-dasharray="364" stroke-dashoffset="364" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="364" to="0" dur="1.5s" fill="freeze" begin="0.7s"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#1479FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.4s"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" fill="#1479FF" font-size="18" font-weight="700" opacity="0">N</text>
    <text x="0" y="12" text-anchor="middle" fill="#7F95A5" font-size="8" font-weight="600" letter-spacing="1" opacity="0">NET</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" fill="freeze" begin="1.2s"/>
    <set attributeName="opacity" to="1" begin="1.2s"/>
    <text x="0" y="95" text-anchor="middle" fill="#EAF7FF" font-size="11" font-weight="600" opacity="0">
      NETWORKING
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.6s"/>
    </text>
    <text x="0" y="110" text-anchor="middle" fill="#7F95A5" font-size="7" opacity="0">
      TCP/IP · DNS · DHCP · Routing · VPN
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.8s"/>
    </text>
  </g>

  <!-- Circle 3: Linux & Systems -->
  <g transform="translate(435,195)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1A2736" stroke-width="4"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#gLinux)" stroke-width="4"
            stroke-dasharray="452" stroke-dashoffset="452" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="452" to="0" dur="1.8s" fill="freeze" begin="0.6s"/>
    </circle>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#1A2736" stroke-width="2"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#00FF88" stroke-width="2"
            stroke-dasharray="364" stroke-dashoffset="364" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="364" to="0" dur="1.5s" fill="freeze" begin="0.9s"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#00FF88" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.6s"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" fill="#00FF88" font-size="18" font-weight="700" opacity="0">L</text>
    <text x="0" y="12" text-anchor="middle" fill="#7F95A5" font-size="8" font-weight="600" letter-spacing="1" opacity="0">PENGUIN</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" fill="freeze" begin="1.4s"/>
    <set attributeName="opacity" to="1" begin="1.4s"/>
    <text x="0" y="95" text-anchor="middle" fill="#EAF7FF" font-size="11" font-weight="600" opacity="0">
      LINUX &amp; SYSTEMS
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="1.8s"/>
    </text>
    <text x="0" y="110" text-anchor="middle" fill="#7F95A5" font-size="7" opacity="0">
      CentOS · SSH · Apache · Bash · SELinux
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.0s"/>
    </text>
  </g>

  <!-- Circle 4: Full Stack Development -->
  <g transform="translate(580,195)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#1A2736" stroke-width="4"/>
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#gFull)" stroke-width="4"
            stroke-dasharray="452" stroke-dashoffset="452" stroke-linecap="round"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="452" to="0" dur="1.8s" fill="freeze" begin="0.8s"/>
    </circle>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#1A2736" stroke-width="2"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#1479FF" stroke-width="2"
            stroke-dasharray="364" stroke-dashoffset="364" stroke-linecap="round" opacity="0.4"
            transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="364" to="0" dur="1.5s" fill="freeze" begin="1.1s"/>
    </circle>
    <circle cx="0" cy="0" r="3" fill="#1479FF" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="1.8s"/>
    </circle>
    <text x="0" y="-8" text-anchor="middle" fill="#1479FF" font-size="16" font-weight="700" opacity="0">&lt;/&gt;</text>
    <text x="0" y="12" text-anchor="middle" fill="#7F95A5" font-size="8" font-weight="600" letter-spacing="1" opacity="0">CODE</text>
    <animate attributeName="opacity" from="0" to="1" dur="0.01s" fill="freeze" begin="1.6s"/>
    <set attributeName="opacity" to="1" begin="1.6s"/>
    <text x="0" y="95" text-anchor="middle" fill="#EAF7FF" font-size="11" font-weight="600" opacity="0">
      FULL STACK
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.0s"/>
    </text>
    <text x="0" y="110" text-anchor="middle" fill="#7F95A5" font-size="7" opacity="0">
      WordPress · HTML · CSS · JS · PHP · MySQL
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="2.2s"/>
    </text>
  </g>

  <!-- Bottom accent line -->
  <line x1="50" y1="370" x2="650" y2="370" stroke="#1A2736" stroke-width="1"/>
  <line x1="50" y1="370" x2="50" y2="370" stroke="#00D9FF" stroke-width="1" stroke-linecap="round">
    <animate attributeName="x2" from="50" to="650" dur="2s" fill="freeze" begin="0.5s"/>
  </line>
</svg>
