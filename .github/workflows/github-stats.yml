name: Update GitHub Statistics

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &hide_rank=false
            &include_all_commits=true
            &count_private=true
            &bg_color=0B1117
            &title_color=00D9FF
            &icon_color=1479FF
            &text_color=EAF7FF
            &border_color=1A2736
            &ring_color=00D9FF
            &label_color=7F95A5
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=5
            &hide=html,css
            &bg_color=0B1117
            &title_color=00D9FF
            &text_color=EAF7FF
            &border_color=1A2736
            &label_color=7F95A5
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update GitHub statistics [skip ci]"
          git push
